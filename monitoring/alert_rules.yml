# Alert rules for Project Management Platform

groups:
  - name: application_alerts
    rules:
      # High error rate
      - alert: HighErrorRate
        expr: rate(http_errors_total[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} errors per second for endpoint {{ $labels.endpoint }}"

      # Very high error rate
      - alert: VeryHighErrorRate
        expr: rate(http_errors_total[5m]) > 0.5
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Very high error rate detected"
          description: "Error rate is {{ $value }} errors per second for endpoint {{ $labels.endpoint }}"

      # Slow response time
      - alert: SlowResponseTime
        expr: http_request_duration_milliseconds{quantile="0.5"} > 5000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow response time detected"
          description: "Median response time is {{ $value }}ms for endpoint {{ $labels.endpoint }}"

      # Very slow response time
      - alert: VerySlowResponseTime
        expr: http_request_duration_milliseconds{quantile="0.5"} > 10000
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Very slow response time detected"
          description: "Median response time is {{ $value }}ms for endpoint {{ $labels.endpoint }}"

      # High memory usage
      - alert: HighMemoryUsage
        expr: go_memstats_alloc_bytes / 1024 / 1024 > 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is {{ $value }}MB"

      # Very high memory usage
      - alert: VeryHighMemoryUsage
        expr: go_memstats_alloc_bytes / 1024 / 1024 > 1000
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Very high memory usage detected"
          description: "Memory usage is {{ $value }}MB"

      # Too many goroutines
      - alert: TooManyGoroutines
        expr: go_goroutines > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Too many goroutines"
          description: "Number of goroutines is {{ $value }}"

      # Application down
      - alert: ApplicationDown
        expr: up{job="project-management-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Application is down"
          description: "The application has been down for more than 1 minute"

  - name: database_alerts
    rules:
      # MongoDB down
      - alert: MongoDBDown
        expr: up{job="mongodb"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MongoDB is down"
          description: "MongoDB has been down for more than 1 minute"

      # High MongoDB connections
      - alert: HighMongoDBConnections
        expr: mongodb_connections{state="current"} > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High MongoDB connections"
          description: "MongoDB has {{ $value }} active connections"

  - name: system_alerts
    rules:
      # High CPU usage
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value }}% on {{ $labels.instance }}"

      # High disk usage
      - alert: HighDiskUsage
        expr: (node_filesystem_size_bytes - node_filesystem_free_bytes) / node_filesystem_size_bytes * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High disk usage"
          description: "Disk usage is {{ $value }}% on {{ $labels.instance }}"

      # Very high disk usage
      - alert: VeryHighDiskUsage
        expr: (node_filesystem_size_bytes - node_filesystem_free_bytes) / node_filesystem_size_bytes * 100 > 95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Very high disk usage"
          description: "Disk usage is {{ $value }}% on {{ $labels.instance }}"

  - name: nginx_alerts
    rules:
      # Nginx down
      - alert: NginxDown
        expr: up{job="nginx"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Nginx is down"
          description: "Nginx has been down for more than 1 minute"

      # High nginx error rate
      - alert: HighNginxErrorRate
        expr: rate(nginx_http_requests_total{status=~"5.."}[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High Nginx error rate"
          description: "Nginx 5xx error rate is {{ $value }} errors per second"