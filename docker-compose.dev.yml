version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pm-postgres-dev
    environment:
      POSTGRES_DB: project_management_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./backend/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - pm-network

  redis:
    image: redis:7-alpine
    container_name: pm-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    networks:
      - pm-network

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile.dev
    container_name: pm-backend-dev
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/project_management_dev
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-jwt-secret-key
      PORT: 3001
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - postgres
      - redis
    networks:
      - pm-network
    command: npm run dev

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile.dev
    container_name: pm-frontend-dev
    environment:
      VITE_API_URL: http://localhost:3001
      VITE_WS_URL: http://localhost:3001
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - pm-network
    command: npm run dev

volumes:
  postgres_data_dev:
  redis_data_dev:

networks:
  pm-network:
    driver: bridge