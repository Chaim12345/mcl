name: Comprehensive Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:5.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: 1.19
    
    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    
    - name: Install dependencies
      run: go mod download
    
    - name: Run backend unit tests
      run: |
        go test -v -coverprofile=coverage-backend.out ./internal/... ./cmd/...
    
    - name: Check backend coverage
      run: |
        coverage=$(go tool cover -func=coverage-backend.out | grep total | awk '{print $3}' | sed 's/%//')
        echo "Backend coverage: ${coverage}%"
        if (( $(echo "$coverage < 85" | bc -l) )); then
          echo "Backend coverage below 85%"
          exit 1
        fi
    
    - name: Run performance benchmarks
      run: |
        go test -bench=. -benchmem ./internal/services/... > backend-benchmark.txt
    
    - name: Upload backend coverage
      uses: actions/upload-artifact@v3
      with:
        name: backend-coverage
        path: |
          coverage-backend.out
          coverage-backend.html
          backend-benchmark.txt

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:5.0
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/vanilla/package-lock.json
    
    - name: Install dependencies
      run: |
        cd frontend/vanilla
        npm ci
    
    - name: Run unit tests
      run: |
        cd frontend/vanilla
        npm run test:coverage
    
    - name: Check frontend coverage
      run: |
        cd frontend/vanilla
        if [ -f "coverage/coverage-summary.json" ]; then
          coverage=$(node -p "require('./coverage/coverage-summary.json').total.lines.pct")
          echo "Frontend coverage: ${coverage}%"
          if (( $(echo "$coverage < 85" | bc -l) )); then
            echo "Frontend coverage below 85%"
            exit 1
          fi
        else
          echo "Coverage report not found"
          exit 1
        fi
    
    - name: Upload frontend coverage
      uses: actions/upload-artifact@v3
      with:
        name: frontend-coverage
        path: frontend/vanilla/coverage/

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:5.0
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: 1.19
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install Go dependencies
      run: go mod download
    
    - name: Build backend
      run: go build -o ./bin/server ./cmd/server
    
    - name: Install frontend dependencies
      run: |
        cd frontend/vanilla
        npm ci
    
    - name: Install Playwright
      run: |
        cd frontend/vanilla
        npx playwright install --with-deps
    
    - name: Start test server
      run: |
        ./bin/server &
        echo $! > server.pid
        sleep 10
    
    - name: Run E2E tests
      run: |
        cd frontend/vanilla
        npm run test:e2e
    
    - name: Upload E2E results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: e2e-results
        path: |
          frontend/vanilla/playwright-report/
          frontend/vanilla/test-results/
    
    - name: Stop test server
      run: |
        if [ -f server.pid ]; then
          kill $(cat server.pid) || true
        fi

  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: 1.19
    
    - name: Install gosec
      run: go install github.com/securecodewarrior/gosec/v2/cmd/gosec@latest
    
    - name: Run gosec scan
      run: |
        gosec -fmt json -out gosec-report.json ./...
        gosec -fmt text -out gosec-report.txt ./...
    
    - name: Upload security report
      uses: actions/upload-artifact@v3
      with:
        name: security-report
        path: |
          gosec-report.json
          gosec-report.txt
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Run npm audit
      run: |
        cd frontend/vanilla
        npm audit
        npm audit --json > npm-audit-report.json
    
    - name: Upload npm audit
      uses: actions/upload-artifact@v3
      with:
        name: npm-audit
        path: frontend/vanilla/npm-audit-report.json

  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:5.0
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: 1.19
    
    - name: Install dependencies
      run: go mod download
    
    - name: Run performance benchmarks
      run: |
        go test -bench=. -benchmem -benchtime=10s ./internal/services/... > performance-results.txt
        cat performance-results.txt
    
    - name: Upload performance results
      uses: actions/upload-artifact@v3
      with:
        name: performance-results
        path: performance-results.txt

  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download backend coverage
      uses: actions/download-artifact@v3
      with:
        name: backend-coverage
        path: coverage/backend/
    
    - name: Download frontend